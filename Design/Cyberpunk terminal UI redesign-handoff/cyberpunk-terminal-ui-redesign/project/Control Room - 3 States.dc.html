<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #050506; }
    a { color: #06b6d4; text-decoration: none; }
    a:hover { color: #22d3ee; }
  </style>
</helmet>

<section style="display: flex; flex-direction: column; gap: 28px; padding: 40px; font-family: 'JetBrains Mono', ui-monospace, monospace;">
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.08em; color: #e4e4e7;">CONTROL ROOM — REDESIGN · 3 STATES</span>
    <span style="font-size: 11px; color: #52525b;">Interactive master with state switcher: <a href="#1a">1a</a> live · <a href="#1b">1b</a> critical alert · <a href="#1c">1c</a> simulation. Open "Control Room.dc.html" for the tweakable version.</span>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start;">

    <div id="1a" style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="padding: 2px 8px; border-radius: 3px; border: 1px solid rgba(16,185,129,0.4); background: rgba(16,185,129,0.07); color: #10b981; font-size: 10px; font-weight: 700; letter-spacing: 0.14em;">1a</span>
        <span style="font-size: 11px; color: #a1a1aa;">DEFAULT — LIVE OPS</span>
      </div>
      <div style="width: 1500px; height: 940px; border-radius: 8px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6);">
        <dc-import name="Control Room" mode="live" hint-size="1500px,940px" style="width: 100%; height: 100%;"></dc-import>
      </div>
    </div>

    <div id="1b" style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="padding: 2px 8px; border-radius: 3px; border: 1px solid rgba(239,68,68,0.4); background: rgba(239,68,68,0.08); color: #ef4444; font-size: 10px; font-weight: 700; letter-spacing: 0.14em;">1b</span>
        <span style="font-size: 11px; color: #a1a1aa;">CRITICAL ALERT — KILL-SWITCH TRIGGERED</span>
      </div>
      <div style="width: 1500px; height: 940px; border-radius: 8px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6);">
        <dc-import name="Control Room" mode="critical" hint-size="1500px,940px" style="width: 100%; height: 100%;"></dc-import>
      </div>
    </div>

    <div id="1c" style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="padding: 2px 8px; border-radius: 3px; border: 1px solid rgba(245,158,11,0.45); background: rgba(245,158,11,0.08); color: #f59e0b; font-size: 10px; font-weight: 700; letter-spacing: 0.14em;">1c</span>
        <span style="font-size: 11px; color: #a1a1aa;">SIMULATION MODE — SYNTHETIC DATA</span>
      </div>
      <div style="width: 1500px; height: 940px; border-radius: 8px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6);">
        <dc-import name="Control Room" mode="simulation" hint-size="1500px,940px" style="width: 100%; height: 100%;"></dc-import>
      </div>
    </div>
  </div>
</section>
</x-dc>
</body>
</html>
