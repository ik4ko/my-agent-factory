<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #070c15; }
    * { box-sizing: border-box; }
    a { color: #7dd3fc; text-decoration: none; }
    a:hover { color: #bae6fd; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #1c2942; border-radius: 3px; }
    :focus-visible { outline: 2px solid #7dd3fc; outline-offset: 1px; }
    @keyframes dotBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes roseBeat { 0%,100% { box-shadow: 0 0 0 1px rgba(255,45,107,0.6), 0 0 22px -8px rgba(255,45,107,0.7); } 50% { box-shadow: 0 0 0 1px rgba(255,45,107,1), 0 0 38px -4px rgba(255,45,107,1); } }
    @keyframes streamPulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes panelIn { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; } }
  </style>
</helmet>

<div data-screen-label="Global chat overlay" style="position: relative; width: 1600px; height: 1000px; display: flex; overflow: hidden; border-radius: 8px; border: 1px solid rgba(148,163,184,0.1); background: #0a1220; color: #94a3b8; font-family: 'General Sans', ui-sans-serif, system-ui, sans-serif; font-size: 12px; box-shadow: 0 40px 120px -30px rgba(0,0,0,0.9);">

  <!-- ══ Dimmed room backdrop (any room) ══ -->
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; display: flex; filter: blur(1.5px); opacity: 0.5; pointer-events: none;">
    <div style="width: 50px; flex-shrink: 0; background: #090f1a; border-right: 1px solid rgba(148,163,184,0.08);"></div>
    <div style="flex: 1; display: flex; flex-direction: column;">
      <div style="height: 40px; border-bottom: 1px solid rgba(148,163,184,0.08); background: #090f1a;"></div>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(12,1fr); grid-template-rows: 1fr 1fr; gap: 8px; padding: 8px;">
        <div style="grid-column: 1/5; border-radius: 6px; border: 1px solid rgba(148,163,184,0.08); background: linear-gradient(180deg,#0e1a2e,#0b1220);"></div>
        <div style="grid-column: 5/9; border-radius: 6px; border: 1px solid rgba(148,163,184,0.08); background: linear-gradient(180deg,#0e1a2e,#0b1220);"></div>
        <div style="grid-column: 9/13; border-radius: 6px; border: 1px solid rgba(148,163,184,0.08); background: linear-gradient(180deg,#0e1a2e,#0b1220);"></div>
        <div style="grid-column: 1/7; border-radius: 6px; border: 1px solid rgba(148,163,184,0.08); background: #080d16;"></div>
        <div style="grid-column: 7/13; border-radius: 6px; border: 1px solid rgba(148,163,184,0.08); background: linear-gradient(180deg,#0e1a2e,#0b1220);"></div>
      </div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; background: radial-gradient(90% 70% at 78% 82%, rgba(7,12,21,0.35), rgba(7,12,21,0.82)); pointer-events: none;"></div>

  <!-- context label -->
  <div style="position: absolute; top: 12px; left: 64px; z-index: 1; display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace;">
    <span style="font-size: 10px; letter-spacing: 0.2em; color: #56657c;">BRAIN HUB</span>
    <span style="font-size: 9px; color: #3d4a5c;">— the orchestrate bar floats over every room</span>
  </div>
  <div style="position: absolute; top: 12px; right: 16px; z-index: 1; display: flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(56,189,248,0.2); background: rgba(10,18,32,0.7); font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.14em; color: #7dd3fc;">
    <span style="width: 5px; height: 5px; border-radius: 50%; background: #38bdf8;"></span>PERSISTS ACROSS ALL ROOMS
  </div>

  <!-- toggle helper (review affordance) -->
  <button type="button" onClick="{{ onToggle }}" style="position: absolute; bottom: 16px; left: 16px; z-index: 6; display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 5px; border: 1px solid rgba(148,163,184,0.2); background: rgba(10,18,32,0.85); color: #94a3b8; font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 700; letter-spacing: 0.12em; cursor: pointer;" style-hover="border-color: rgba(125,211,252,0.5); color: #7dd3fc;">◑ TOGGLE STATE — {{ stateLabel }}</button>

  <!-- ══ COLLAPSED PILL ══ -->
  <sc-if value="{{ collapsed }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; bottom: 20px; right: 20px; z-index: 5; width: 460px;">
      <button type="button" onClick="{{ onExpand }}" style="width: 100%; display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(56,189,248,0.25); border-left: 2px solid #38bdf8; background: rgba(11,18,32,0.92); backdrop-filter: blur(14px); cursor: pointer; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.8); text-align: left;" style-hover="border-color: rgba(56,189,248,0.5);">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: #38bdf8; line-height: 1;">&gt;</span>
        <span style="flex: 1; font-size: 12px; color: #6b7c96;">Orchestrate across agents…</span>
        <span style="display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.1em; color: #34d399;"><span style="width: 5px; height: 5px; border-radius: 50%; background: #34d399; animation: dotBlink 2s ease-in-out infinite;"></span>HERMES · 3 ACTIVE</span>
        <span style="display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 3px; background: #ff2d6b; font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 700; letter-spacing: 0.1em; color: #1a0510; animation: roseBeat 1.3s ease-in-out infinite;"><span style="width: 5px; height: 5px; border-radius: 50%; background: #1a0510; animation: dotBlink 1s ease-in-out infinite;"></span>1 APPROVAL</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#56657c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"></path></svg>
      </button>
    </div>
  </sc-if>

  <!-- ══ EXPANDED PANEL ══ -->
  <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; bottom: 20px; right: 20px; z-index: 5; width: 470px; height: 660px; display: flex; flex-direction: column; border-radius: 10px; border: 1px solid rgba(56,189,248,0.2); background: linear-gradient(180deg, rgba(12,20,34,0.95), rgba(8,13,22,0.97)); backdrop-filter: blur(16px); box-shadow: 0 40px 90px -30px rgba(0,0,0,0.9); overflow: hidden; animation: panelIn 0.3s cubic-bezier(0.2,0.7,0.2,1);">

      <!-- header -->
      <div style="display: flex; flex-shrink: 0; align-items: center; gap: 9px; padding: 12px 14px; border-bottom: 1px solid rgba(148,163,184,0.08);">
        <span style="font-size: 14px; font-weight: 700; color: #38bdf8; line-height: 1;">&gt;</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #e8eef7;">ORCHESTRATE</span>
        <span style="display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.1em; color: #34d399;"><span style="width: 5px; height: 5px; border-radius: 50%; background: #34d399; animation: dotBlink 2s ease-in-out infinite;"></span>HERMES ROUTING</span>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 6px;">
          <div style="display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(148,163,184,0.16); font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.08em; color: #94a3b8;">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#56657c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"></path></svg>
            SCOPE · {{ scope }}
          </div>
          <button type="button" onClick="{{ onCollapse }}" title="Collapse" style="display: flex; width: 26px; height: 26px; align-items: center; justify-content: center; border-radius: 5px; border: 1px solid rgba(148,163,184,0.16); background: transparent; color: #94a3b8; cursor: pointer;" style-hover="border-color: rgba(125,211,252,0.5); color: #7dd3fc;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
        </div>
      </div>

      <!-- thread -->
      <div ref="{{ threadRef }}" style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px;">
        <sc-for list="{{ messages }}" as="m" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 5px; align-items: {{ m.align }};">
            <sc-if value="{{ m.showName }}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; align-items: center; gap: 7px;">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; color: {{ m.nameColor }};">{{ m.name }}</span>
                <sc-if value="{{ m.role2 }}" hint-placeholder-val="{{ false }}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 8px; color: #56657c;">{{ m.role2 }}</span></sc-if>
                <sc-if value="{{ m.streaming }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; gap: 2px;"><span style="width: 3px; height: 3px; border-radius: 50%; background: #7dd3fc; animation: streamPulse 1s ease-in-out infinite;"></span><span style="width: 3px; height: 3px; border-radius: 50%; background: #7dd3fc; animation: streamPulse 1s ease-in-out 0.2s infinite;"></span><span style="width: 3px; height: 3px; border-radius: 50%; background: #7dd3fc; animation: streamPulse 1s ease-in-out 0.4s infinite;"></span></span></sc-if>
              </div>
            </sc-if>
            <div style="max-width: 86%; padding: 9px 12px; border-radius: 8px; border: 1px solid {{ m.bubbleBorder }}; background: {{ m.bubbleBg }}; color: {{ m.textColor }}; font-size: 12px; line-height: 1.55; {{ m.bubbleExtra }}">{{ m.text }}</div>
            <sc-if value="{{ m.hasChips }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-wrap: wrap; gap: 5px; max-width: 86%;">
                <sc-for list="{{ m.chips }}" as="c" hint-placeholder-count="2">
                  <a href="{{ c.href }}" style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 3px; border: 1px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.color }}; font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.06em; {{ c.extra }}">{{ c.label }}</a>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <!-- routing chips + input -->
      <div style="flex-shrink: 0; padding: 10px 12px 12px; border-top: 1px solid rgba(148,163,184,0.08); display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; flex-wrap: wrap; gap: 5px;">
          <sc-for list="{{ quickChips }}" as="q" hint-placeholder-count="5">
            <button type="button" onClick="{{ q.onClick }}" style="padding: 3px 9px; border-radius: 3px; border: 1px solid {{ q.border }}; background: {{ q.bg }}; color: {{ q.color }}; font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 600; cursor: pointer;" style-hover="border-color: rgba(125,211,252,0.5);">{{ q.label }}</button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: flex-end; gap: 9px; padding: 9px 11px; border-radius: 6px; border: 1px solid rgba(56,189,248,0.22); border-left: 2px solid #38bdf8; background: rgba(8,13,22,0.7);">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #38bdf8; line-height: 1.4;">&gt;</span>
          <textarea value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" placeholder="Orchestrate across agents — HERMES will route it to the right room…" rows="1" style="flex: 1; min-width: 0; resize: none; max-height: 80px; background: transparent; border: none; outline: none; color: #e8eef7; font-family: 'General Sans', sans-serif; font-size: 12px; line-height: 1.5;"></textarea>
          <button type="button" title="Voice" style="display: flex; width: 26px; height: 26px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 5px; border: 1px solid rgba(148,163,184,0.16); background: transparent; color: #56657c; cursor: pointer;" style-hover="color: #7dd3fc; border-color: rgba(125,211,252,0.4);">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0M12 17v4"></path></svg>
          </button>
          <button type="button" onClick="{{ onSend }}" title="Send" style="display: flex; width: 30px; height: 30px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 5px; border: 1px solid {{ sendBorder }}; background: {{ sendBg }}; color: {{ sendColor }}; cursor: pointer;" style-hover="filter: brightness(1.15);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
          </button>
        </div>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 8px; color: #3d4a5c; letter-spacing: 0.06em;">↵ send · ⇧↵ newline · routed by HERMES · trained-knowledge agents flagged in-thread</span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    expanded: true,
    scope: 'ALL ROOMS',
    draft: '',
    messages: [
      { role: 'user', text: 'Rebalance the model pool — opus is saturating under load.' },
      { role: 'hermes', text: 'Classified as orchestration. Routing to CODEX for a model-router patch and AEGIS for guardrail review. Opened run R-2214.',
        chips: [['R-2214 → CODING ROOM', 'room', 'Coding Room.dc.html'], ['+ AEGIS review', 'plain', '#']] },
      { role: 'agent', name: 'CODEX', color: '#a78bfa', role2: 'fable-5', streaming: true,
        text: 'Drafting patch to model-router.ts — depth-based lane fallback. Seating on fable-5 when opus queue-depth > 3…',
        chips: [['DIFF +212 −87 → REVIEW', 'code', 'Coding Room.dc.html']] },
      { role: 'user', text: "How's the NVDA momentum signal looking?" },
      { role: 'agent', name: 'GROK', color: '#38bdf8', role2: 'grok-3',
        text: 'Momentum confidence 0.82 on gap+volume. I staged a ½-Kelly BUY 40 NVDA (2.1% of book, est $7,284) — it needs your approval before it can reach the paper broker.',
        chips: [['● APPROVAL PENDING → TRADING ROOM', 'rose', 'Trading Room.dc.html']] },
    ],
  };

  componentDidUpdate() { this._scrollBottom(); }
  componentDidMount() { this._scrollBottom(); }
  _scrollBottom() { if (this._thread) this._thread.scrollTop = this._thread.scrollHeight; }

  _send() {
    const v = this.state.draft.trim();
    if (!v) return;
    this.setState((s) => ({ draft: '', messages: [...s.messages, { role: 'user', text: v }] }));
    clearTimeout(this._reply);
    this._reply = setTimeout(() => {
      this.setState((s) => ({ messages: [...s.messages, { role: 'hermes', text: 'Received. Classifying domain and selecting the best-fit agent — I will route this to the relevant room and open a run.', chips: [['ROUTING…', 'plain', '#']] }] }));
    }, 700);
  }

  renderVals() {
    const s = this.state;
    const t = (hex, a) => { const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };

    const chipStyle = {
      room: { border: 'rgba(56,189,248,0.35)', bg: 'rgba(56,189,248,0.06)', color: '#7dd3fc', extra: '' },
      code: { border: 'rgba(167,139,250,0.35)', bg: 'rgba(167,139,250,0.06)', color: '#c4b5fd', extra: '' },
      plain: { border: 'rgba(148,163,184,0.2)', bg: 'transparent', color: '#94a3b8', extra: '' },
      rose: { border: '#ff2d6b', bg: '#ff2d6b', color: '#1a0510', extra: 'font-weight:700; animation: roseBeat 1.3s ease-in-out infinite;' },
    };

    const messages = s.messages.map((m) => {
      const isUser = m.role === 'user';
      const isHermes = m.role === 'hermes';
      let name = isUser ? 'YOU' : isHermes ? 'HERMES' : m.name;
      let nameColor = isUser ? '#94a3b8' : isHermes ? '#38bdf8' : m.color;
      return {
        align: isUser ? 'flex-end' : 'flex-start',
        showName: !isUser,
        name, nameColor, role2: m.role2 || (isHermes ? 'orchestrator' : ''),
        streaming: !!m.streaming,
        text: m.text,
        textColor: isUser ? '#e8eef7' : '#cdd9e8',
        bubbleBorder: isUser ? 'rgba(56,189,248,0.25)' : isHermes ? 'rgba(56,189,248,0.16)' : 'rgba(148,163,184,0.1)',
        bubbleBg: isUser ? 'rgba(56,189,248,0.08)' : isHermes ? 'rgba(56,189,248,0.03)' : 'rgba(255,255,255,0.014)',
        bubbleExtra: isHermes ? 'border-left: 2px solid rgba(56,189,248,0.5);' : '',
        hasChips: !!(m.chips && m.chips.length),
        chips: (m.chips || []).map((c) => ({ label: c[0], href: c[2] || '#', ...chipStyle[c[1]] })),
      };
    });

    const scopes = ['ALL ROOMS', 'TRADING', 'CODING', 'PERSONAL'];
    const quickChips = [
      { label: '@HERMES', kind: 'a' }, { label: '@CODEX', kind: 'a' }, { label: '@GROK', kind: 'a' },
      { label: '#trading', kind: 'r' }, { label: '#coding', kind: 'r' },
    ].map((q) => ({ label: q.label, border: q.kind === 'r' ? 'rgba(56,189,248,0.25)' : 'rgba(148,163,184,0.18)', bg: q.kind === 'r' ? 'rgba(56,189,248,0.05)' : 'rgba(255,255,255,0.012)', color: q.kind === 'r' ? '#7dd3fc' : '#94a3b8', onClick: () => this.setState((st) => ({ draft: (st.draft ? st.draft + ' ' : '') + q.label + ' ' })) }));

    const hasDraft = !!s.draft.trim();
    return {
      expanded: s.expanded, collapsed: !s.expanded,
      stateLabel: s.expanded ? 'EXPANDED' : 'COLLAPSED',
      scope: s.scope, messages, quickChips,
      draft: s.draft,
      threadRef: (el) => { this._thread = el; },
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this._send(); } },
      onSend: () => this._send(),
      onExpand: () => this.setState({ expanded: true }),
      onCollapse: () => this.setState({ expanded: false }),
      onToggle: () => this.setState((st) => ({ expanded: !st.expanded })),
      sendBorder: hasDraft ? '#38bdf8' : 'rgba(148,163,184,0.16)',
      sendBg: hasDraft ? 'rgba(56,189,248,0.15)' : 'transparent',
      sendColor: hasDraft ? '#7dd3fc' : '#56657c',
    };
  }
}
</script>
</body>
</html>
