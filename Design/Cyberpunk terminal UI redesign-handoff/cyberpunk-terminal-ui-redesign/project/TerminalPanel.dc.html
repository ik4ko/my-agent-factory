<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #09090b; }
    a { color: #06b6d4; text-decoration: none; }
    a:hover { color: #22d3ee; }
    @keyframes pulseFaint { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
  </style>
</helmet>

<section style="position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0; box-sizing: border-box; border-radius: 5px; border: 1px solid rgba(255,255,255,0.03); background: rgba(9,9,11,0.4); backdrop-filter: blur(12px); font-family: 'JetBrains Mono', ui-monospace, monospace; color: #a1a1aa;" style-before="content: ''; position: absolute; top: -1px; left: -1px; width: 9px; height: 9px; border-top: 1px solid rgba(6,182,212,0.4); border-left: 1px solid rgba(6,182,212,0.4); pointer-events: none;" style-after="content: ''; position: absolute; bottom: -1px; right: -1px; width: 9px; height: 9px; border-bottom: 1px solid rgba(168,85,247,0.3); border-right: 1px solid rgba(168,85,247,0.3); pointer-events: none;">
  <div style="display: flex; flex-shrink: 0; align-items: center; gap: 10px; padding: 5px 9px; border-bottom: 1px solid rgba(255,255,255,0.03);">
    <span style="font-size: 9px; letter-spacing: 0.2em; color: #71717a;">{{ title }}</span>
    <div style="display: flex; gap: 3px;">
      <sc-for list="{{ sevChips }}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{ c.onClick }}" style="padding: 2px 8px; border-radius: 3px; border: 1px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.color }}; font-family: inherit; font-size: 8px; font-weight: 700; letter-spacing: 0.14em; cursor: pointer;" style-hover="filter: brightness(1.3);">{{ c.label }}</button>
      </sc-for>
    </div>
    <button type="button" onClick="{{ toggleHb }}" style="display: flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 3px; border: 1px solid {{ hbBorder }}; background: {{ hbBg }}; color: {{ hbColor }}; font-family: inherit; font-size: 8px; letter-spacing: 0.12em; cursor: pointer;" style-hover="filter: brightness(1.3);">{{ hbLabel }}</button>
    <span style="margin-left: auto; font-size: 8.5px; color: #3f3f46; font-variant-numeric: tabular-nums;">{{ logCount }} shown · {{ logRate }}/min</span>
  </div>
  <div ref="{{ termRef }}" style="flex: 1; min-height: 0; overflow-y: auto; padding: 6px 9px; font-size: 10px; line-height: 1.65;">
    <sc-for list="{{ logView }}" as="l" hint-placeholder-count="8">
      <div style="display: flex; gap: 8px; align-items: baseline; padding: {{ l.pad }}; margin: {{ l.margin }}; border-radius: 3px; border: 1px solid {{ l.rowBorder }}; background: {{ l.rowBg }}; box-shadow: {{ l.rowGlow }};">
        <span style="flex-shrink: 0; color: #3f3f46; font-variant-numeric: tabular-nums; font-size: 9px;">{{ l.time }}</span>
        <span style="flex-shrink: 0; width: 30px; font-weight: 700; font-size: 9px; color: {{ l.tagColor }};">{{ l.tag }}</span>
        <span style="min-width: 0; color: {{ l.msgColor }}; font-weight: {{ l.weight }}; white-space: pre-wrap; word-break: break-word;">{{ l.message }}</span>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 720, &quot;height&quot;: 300 },
  &quot;title&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;TERMINAL&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;pool&quot;: { &quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;[string, string, boolean][] | null&quot; },
  &quot;pinnedCritical&quot;: { &quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;string[] | null&quot; }
}">
class Component extends DCLogic {
  state = { logs: [], sevFilter: 'all', hideHb: false, logRate: 12 };

  DEFAULT_POOL = [
    ['DBG', 'heartbeat: fleet ack ok (42ms)', true],
    ['INF', 'orchestrator: tick — 2 running, 1 pending', false],
    [' OK', 'task complete in 84s (18.4k tok)', false],
    ['WRN', 'rate-limited by target host, backoff 8s', false],
  ];

  componentDidMount() {
    const pool = this.props.pool ?? this.DEFAULT_POOL;
    const now = Date.now();
    this.setState({ logs: pool.slice(0, Math.min(12, pool.length)).map((l, i) => this._mk(l, now - (12 - i) * 8000)) });
    this._idx = Math.min(12, pool.length);
    this._id = setInterval(() => {
      const entry = pool[this._idx % pool.length];
      this._idx++;
      this.setState((s) => ({
        logs: [...s.logs.slice(-60), this._mk(entry, Date.now())],
        logRate: 9 + Math.floor(Math.random() * 8),
      }));
    }, 1800);
  }

  componentWillUnmount() { clearInterval(this._id); }

  componentDidUpdate() { if (this._termEl) this._termEl.scrollTop = this._termEl.scrollHeight; }

  _mk(entry, ts) {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return { id: ts + entry[1].slice(0, 8), sev: entry[0].trim(), hb: !!entry[2],
      time: p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds()), msg: entry[1] };
  }

  _tint(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  renderVals() {
    const s = this.state;
    const rank = { DBG: 0, INF: 1, OK: 1, WRN: 2, CRIT: 3 };
    const minRank = s.sevFilter === 'crit' ? 3 : s.sevFilter === 'warn' ? 2 : 0;
    let visible = s.logs.filter((l) => (rank[l.sev] ?? 1) >= minRank && !(s.hideHb && l.hb));

    const pinned = this.props.pinnedCritical;
    if (pinned) {
      const critLogs = pinned.map((m, i) => this._mk(['CRIT', m, false], Date.now() - 90000 + i * 4000));
      const cut = Math.max(0, visible.length - 4);
      visible = [...visible.slice(0, cut), ...critLogs, ...visible.slice(cut)];
    }

    const cfg = {
      DBG:  ['#3f3f46', '#52525b', 400], INF: ['#8b8b93', '#a1a1aa', 400],
      OK:   ['#10b981', '#a1a1aa', 400], WRN: ['#f59e0b', 'rgba(245,158,11,0.85)', 500],
      CRIT: ['#ef4444', '#fca5a5', 700],
    };
    const logView = visible.map((l) => {
      const c = cfg[l.sev] || cfg.INF;
      const crit = l.sev === 'CRIT';
      return { id: l.id, time: l.time, tag: l.sev, message: l.msg,
        tagColor: c[0], msgColor: c[1], weight: c[2],
        rowBorder: crit ? 'rgba(239,68,68,0.5)' : 'transparent',
        rowBg: crit ? 'rgba(239,68,68,0.08)' : 'transparent',
        rowGlow: crit ? '0 0 14px rgba(239,68,68,0.15)' : 'none',
        pad: crit ? '5px 8px' : '0px 2px', margin: crit ? '3px 0' : '0' };
    });

    const chip = (key, label, color) => {
      const on = s.sevFilter === key;
      return { label, onClick: () => this.setState({ sevFilter: key }),
        border: on ? this._tint(color, 0.45) : 'rgba(255,255,255,0.06)',
        bg: on ? this._tint(color, 0.1) : 'transparent',
        color: on ? color : '#52525b' };
    };

    return {
      termRef: (el) => { this._termEl = el; },
      title: this.props.title ?? 'TERMINAL',
      logView, logCount: logView.length, logRate: s.logRate,
      sevChips: [chip('all', 'ALL', '#06b6d4'), chip('warn', 'WRN+', '#f59e0b'), chip('crit', 'CRIT', '#ef4444')],
      toggleHb: () => this.setState({ hideHb: !s.hideHb }),
      hbLabel: s.hideHb ? '◦ HEARTBEAT HIDDEN' : '● HEARTBEAT SHOWN',
      hbColor: s.hideHb ? '#06b6d4' : '#52525b',
      hbBorder: s.hideHb ? 'rgba(6,182,212,0.35)' : 'rgba(255,255,255,0.06)',
      hbBg: s.hideHb ? 'rgba(6,182,212,0.07)' : 'transparent',
    };
  }
}
</script>
</body>
</html>
