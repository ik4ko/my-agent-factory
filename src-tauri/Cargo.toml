[package]
name = "my-agent-factory"
version = "0.1.0"
description = "My Agent Factory — Control Room desktop shell"
authors = ["My Agent Factory"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "my_agent_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# macos-private-api is required for `transparent: true` on macOS.
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
